<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFS Policy Mailer — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3080; --navy-dark:#0f1c56;
  --gold:#c8a000;
  --card:#fff; --border:#e2e7f2;
  --text:#12162b; --muted:#55607a;
  --danger:#dc2626; --danger-dim:rgba(220,38,38,0.1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--navy-dark),var(--navy) 55%,#243a94);
  font-family:'Fira Sans',sans-serif; padding:20px;
}
.card{
  width:100%; max-width:360px; background:var(--card); border-radius:16px;
  padding:36px 32px 32px; box-shadow:0 20px 60px rgba(0,0,0,0.35);
  text-align:center;
}
.brand{
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gold); margin-bottom:6px;
}
h1{ font-size:18px; font-weight:700; color:var(--navy); margin-bottom:4px; }
.sub{ font-size:12px; color:var(--muted); margin-bottom:28px; }
input[type=password]{
  width:100%; font-family:'Fira Code',monospace; font-size:20px; letter-spacing:.3em;
  text-align:center; padding:12px 10px; border:1.5px solid var(--border); border-radius:10px;
  outline:none; color:var(--text); transition:border-color .2s;
}
input[type=password]:focus{ border-color:var(--gold); }
.error{
  margin-top:14px; font-size:12px; color:var(--danger); background:var(--danger-dim);
  border-radius:8px; padding:9px 10px;
}
button{
  width:100%; margin-top:18px; padding:12px; border:none; border-radius:10px;
  background:var(--navy); color:#fff; font-family:'Fira Sans',sans-serif; font-size:12px;
  font-weight:700; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
  transition:background .2s;
}
button:hover{ background:var(--navy-dark); }
.footer{ margin-top:20px; font-size:10px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Nyaradzo Financial Services</div>
    <h1>Lapsed Policy Distribution Portal</h1>
    <div class="sub">Enter the access code to continue</div>
    <form method="get">
      <input type="password" name="code" inputmode="numeric" autocomplete="off" autofocus placeholder="••••" maxlength="20">
      <? if (showError) { ?>
      <div class="error">Incorrect access code — please try again.</div>
      <? } ?>
      <button type="submit">Enter</button>
    </form>
    <div class="footer">Internal use only &mdash; Nyaradzo Financial Services</div>
  </div>
</body>
</html>
